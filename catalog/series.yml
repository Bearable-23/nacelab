# Catálogo de series — el corazón del proyecto.
#
# Agregar un indicador debe ser editar unas líneas aquí, nunca escribir un script.
# Este archivo es a la vez: configuración del pipeline, documentación del sitio
# y material de los tutoriales.
#
# CAMPO `verificado`:
#   true  = confirmado contra la API Y confirmado que es EL indicador que dice ser
#   false = no confirmado. Ojo: que un id responda 200 no significa que sea
#           el indicador correcto. Devolver datos plausibles de otra serie es
#           justo el modo de falla que hay que evitar.
#
# Para probar:  python scripts/probar_series.py

series:

  # ---------------------------------------------------------------- BANXICO --
  - id: fix
    nombre: Tipo de cambio FIX (pesos por dólar)
    fuente: banxico
    fuente_id: SF43718
    frecuencia: diaria
    unidad: mxn_por_usd
    verificado: false
    nota: >
      Documentado como "Pesos por Dólar. FIX" en el SIE. Sin probar todavía:
      falta BANXICO_TOKEN.

  # ------------------------------------------------------------------ INEGI --
  - id: poblacion_total
    nombre: Población total de México
    fuente: inegi
    fuente_id: "1002000001"
    banco: BISE
    frecuencia: irregular
    unidad: personas
    verificado: true
    nota: >
      CONFIRMADO 2026-09-02: 15 observaciones, censos 1910-2020,
      126,014,024 en 2020. Es el ejemplo de la documentación oficial.
      No se va a mostrar en el sitio: es la prueba de humo del pipeline.

  - id: inpc_subyacente
    nombre: INPC subyacente (índice base 2Q julio 2018 = 100)
    fuente: inegi
    fuente_id: "334452"
    banco: BIE-BISE
    frecuencia: mensual
    unidad: indice
    verificado: true
    nota: >
      CONFIRMADO 2026-09-02. 403 observaciones, 1993/01 a 2026/07,
      actualizado 2026-08-24.
      Identificado contra las cifras publicadas por el INEGI para julio 2026:
      la serie da índice 146.0001 y variación anual 3.95%. El INEGI reportó
      subyacente 3.95% anual, y general 3.12% con índice 145.169.
      Coincide con el subyacente y NO coincide con el general: dos vías
      independientes apuntan al mismo lado.

  # Prueba de aceptación para cuando aparezca el id del general:
  # su valor de 2026/07 tiene que ser 145.169 y su variación anual 3.12%.
  # Si no da eso, el id está mal por más que responda 200.
  - id: inpc_general
    nombre: INPC general (índice base 2Q julio 2018 = 100)
    fuente: inegi
    fuente_id: null
    banco: BIE-BISE
    frecuencia: mensual
    unidad: indice
    verificado: false
    nota: Falta el id. Sacarlo del constructor de consultas.

  - id: igae
    nombre: Indicador Global de la Actividad Económica
    fuente: inegi
    fuente_id: null
    banco: BIE-BISE
    frecuencia: mensual
    unidad: indice
    verificado: false
    nota: Falta el id. Sacarlo del constructor de consultas.


# ---------------------------------------------------------------------------
# HALLAZGO: el parámetro de fuente debe coincidir con el banco del indicador
# ---------------------------------------------------------------------------
# Probado el 2026-09-02 con token válido:
#
#   334452     + BIE-BISE  -> 200, 403 obs (índice de precios, mensual)
#   334452     + BIE       -> 400
#   628194     + BIE-BISE  -> 200  (pero LASTUPDATE 2024-10: serie descontinuada)
#   628229     + BIE-BISE  -> 200
#   1002000001 + BISE      -> 200  (población)
#   1002000001 + BIE-BISE  -> 400
#   496150, 381016 + BIE-BISE -> 400  (esos sí no existen)
#
# No hay un valor de `banco` universal:
#   BIE-BISE  económicos de coyuntura (INPC, IGAE, empleo, producción)
#   BISE      censos y encuestas (población, vivienda)
#
# Por eso `banco` es un campo POR SERIE, no un default global.
#
# Nota sobre series descontinuadas: 628194 responde 200 y devuelve datos que
# se ven perfectamente normales, pero su última actualización es de octubre
# de 2024. Un id que responde no es un id vigente. Siempre hay que mirar
# LASTUPDATE antes de construir encima.
# ---------------------------------------------------------------------------

inegi_defaults:
  idioma: es              # es | en
  entidad: "00"           # 00 nacional | 99 por entidad | 999 por municipio
  dato_reciente: false    # false = serie histórica completa | true = solo la última obs
  version: "2.0"
