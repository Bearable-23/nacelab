# Catálogo de series — el corazón del proyecto.
#
# Agregar un indicador debe ser editar unas líneas aquí, nunca escribir un script.
# Este archivo es a la vez: configuración del pipeline, documentación del sitio
# y material de los tutoriales.
#
# CAMPO `verificado`:
#   true  = confirmado contra la API Y confirmado que es EL indicador que dice ser
#   false = no confirmado. Ojo: que un id responda 200 no significa que sea
#           el indicador correcto. Devolver datos plausibles de otra serie es
#           justo el modo de falla que hay que evitar.
#
# Para probar:  python scripts/probar_series.py


# ---------------------------------------------------------------------------
# TEMAS — la estructura del sitio, no solo etiquetas
# ---------------------------------------------------------------------------
# El tablero se dibuja recorriendo esta lista, en este orden. Un tema sin
# series verificadas no se dibuja, así que agregar un indicador al catálogo
# lo hace aparecer en su sección sin tocar una línea de la app.
#
# `variacion: true` significa que lo interesante de esas series es cómo
# CAMBIAN, no su nivel: la tarjeta y la gráfica muestran la variación anual y
# el eje se ancla en cero, porque ahí el cero sí significa algo. En un índice
# de nivel (población, IGAE) anclar en cero aplasta la serie contra el techo.
#
# `referencia` dibuja una línea punteada horizontal. Solo tiene sentido si
# existe un objetivo declarado por alguien: el 3% es la meta de Banxico, no un
# número que hayamos elegido nosotros.
temas:
  - id: precios
    nombre: Precios
    descripcion: Qué tan rápido pierde poder de compra el peso.
    variacion: true
    referencia: 3.0

  - id: actividad
    nombre: Actividad económica
    descripcion: Qué tanto se está produciendo.
    variacion: false

  - id: tipo_cambio
    nombre: Tipo de cambio
    descripcion: Cuántos pesos cuesta un dólar.
    variacion: false

  - id: demografia
    nombre: Demografía
    descripcion: Cuántos somos. Cambia despacio y por eso da escala a lo demás.
    variacion: false


series:

  # ---------------------------------------------------------------- BANXICO --
  - id: fix
    nombre: Tipo de cambio FIX (pesos por dólar)
    fuente: banxico
    fuente_id: SF43718
    tema: tipo_cambio
    frecuencia: diaria
    unidad: mxn_por_usd
    verificado: false
    nota: >
      Documentado como "Pesos por Dólar. FIX" en el SIE. Sin probar todavía:
      falta BANXICO_TOKEN.

  # ------------------------------------------------------------------ INEGI --
  - id: poblacion_total
    nombre: Población total de México
    fuente: inegi
    fuente_id: "1002000001"
    tema: demografia
    banco: BISE
    frecuencia: irregular
    unidad: personas
    verificado: true
    nota: >
      CONFIRMADO 2026-09-02: 15 observaciones, censos 1910-2020,
      126,014,024 en 2020. Es el ejemplo de la documentación oficial.
      No se va a mostrar en el sitio: es la prueba de humo del pipeline.

  - id: inpc_subyacente
    nombre: INPC subyacente (índice base 2Q julio 2018 = 100)
    fuente: inegi
    fuente_id: "334452"
    tema: precios
    banco: BIE-BISE
    frecuencia: mensual
    unidad: indice
    verificado: true
    nota: >
      CONFIRMADO 2026-09-02. 403 observaciones, 1993/01 a 2026/07,
      actualizado 2026-08-24.
      Identificado contra las cifras publicadas por el INEGI para julio 2026:
      la serie da índice 146.0001 y variación anual 3.95%. El INEGI reportó
      subyacente 3.95% anual, y general 3.12% con índice 145.169.
      Coincide con el subyacente y NO coincide con el general: dos vías
      independientes apuntan al mismo lado.

  - id: inpc_general
    nombre: INPC general (índice base 2Q julio 2018 = 100)
    fuente: inegi
    fuente_id: "334360"
    tema: precios
    banco: BIE-BISE
    frecuencia: mensual
    unidad: indice
    verificado: true
    nota: >
      CONFIRMADO 2026-09-02. 403 observaciones, 1993/01 a 2026/07,
      actualizado 2026-08-24.
      La prueba de aceptación se fijó ANTES de conocer el id: 2026/07 tenía
      que dar 145.169 según el boletín del INEGI. La serie da 145.1690.
      Corrobora que comparte TOPIC 682416, UNIT 1012 y SOURCE 1068 con el
      subyacente: son series hermanas del mismo cuadro.

  - id: igae
    nombre: Indicador Global de la Actividad Económica
    fuente: inegi
    fuente_id: null
    tema: actividad
    banco: BIE-BISE
    frecuencia: mensual
    unidad: indice
    verificado: false
    nota: Falta el id. Sacarlo del constructor de consultas.


# ---------------------------------------------------------------------------
# HALLAZGO: el parámetro de fuente debe coincidir con el banco del indicador
# ---------------------------------------------------------------------------
# Probado el 2026-09-02 con token válido:
#
#   334452     + BIE-BISE  -> 200, 403 obs (índice de precios, mensual)
#   334452     + BIE       -> 400
#   628194     + BIE-BISE  -> 200  (pero LASTUPDATE 2024-10: serie descontinuada)
#   628229     + BIE-BISE  -> 200
#   1002000001 + BISE      -> 200  (población)
#   1002000001 + BIE-BISE  -> 400
#   496150, 381016 + BIE-BISE -> 400  (esos sí no existen)
#
# No hay un valor de `banco` universal:
#   BIE-BISE  económicos de coyuntura (INPC, IGAE, empleo, producción)
#   BISE      censos y encuestas (población, vivienda)
#
# Por eso `banco` es un campo POR SERIE, no un default global.
#
# Nota sobre series descontinuadas: 628194 responde 200 y devuelve datos que
# se ven perfectamente normales, pero su última actualización es de octubre
# de 2024. Un id que responde no es un id vigente. Siempre hay que mirar
# LASTUPDATE antes de construir encima.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# TOLERANCIA PARA BUSCAR LA OBSERVACIÓN DE REFERENCIA
# ---------------------------------------------------------------------------
# Para calcular una variación mensual hay que comparar contra el dato de hace
# un mes. gold busca la fecha EXACTA, que es lo correcto casi siempre: si
# falta el dato, el resultado es nulo y un hueco honesto vale más que un
# número inventado.
#
# Pero una serie hábil-diaria como el tipo de cambio no cotiza sábados,
# domingos ni días festivos. La fecha de "hace exactamente un mes" cae en fin
# de semana unas 2 de cada 7 veces, así que la regla exacta dejaría alrededor
# de un 30% de la serie sin variación, sin que nada esté mal.
#
# `tolerancia_dias` es cuántos días hacia ATRÁS se acepta retroceder para
# encontrar la observación de referencia. Nunca hacia adelante: comparar
# contra un dato posterior al objetivo sería mirar el futuro.
#
#   0 = solo la fecha exacta (el comportamiento de siempre)
#   7 = cubre un fin de semana largo y los puentes
#
# gold registra QUÉ fecha usó realmente en `fecha_ref_mensual` y
# `fecha_ref_anual`. Una comparación aproximada que no dice contra qué se
# aproximó no es auditable.
tolerancia_dias:
  diaria: 7
  quincenal: 0
  mensual: 0
  trimestral: 0
  anual: 0
  irregular: 0


inegi_defaults:
  idioma: es              # es | en
  entidad: "00"           # 00 nacional | 99 por entidad | 999 por municipio
  dato_reciente: false    # false = serie histórica completa | true = solo la última obs
  version: "2.0"
